<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avatar Studio · 模型验收</title><link rel="stylesheet" href="viewer.css">
<script type="importmap">{"imports":{"three":"/web/vendor/three/build/three.module.js","three/addons/":"/web/vendor/three/examples/jsm/","@pixiv/three-vrm":"/web/vendor/three-vrm.module.js"}}</script>
</head><body>
<header><span class="brand">◈ AVATAR STUDIO</span><span id="character-name">模型验收</span><span id="state">加载中…</span></header>
<main><aside><p class="eyebrow">REFERENCE → RECONSTRUCTION</p><h1>从立绘，<br>到三维角色。</h1>
<p id="engine">真实重建 · VRM 1.0</p><img id="reference" alt="输入的人物立绘"><div id="stats"></div>
<p class="note">自动重建草稿。背面由模型推断；骨骼位置和权重仍可能需要手工修正。无表情、布料或头发物理。</p>
<a id="download" download>下载 VRM</a><a id="download-glb" download>下载 GLB</a>
</aside><section id="stage"><div id="controls"><select id="model" aria-label="模型版本"><option value="avatar.vrm">骨骼模型 VRM</option><option value="reconstructed.glb">重建原始网格 GLB</option></select>
<button data-view="front">正面</button><button data-view="side">角色左侧</button><button data-view="opposite">角色右侧</button><button data-view="back">背面</button><button data-view="face">脸部细节</button><button data-view="leftHand">左手近景</button><button data-view="rightHand">右手近景</button>
<label>动作<select id="action" aria-label="动作"><option value="idle">待机</option><option value="walk">走路</option><option value="wave">挥手</option></select></label><label><input id="bones" type="checkbox">显示骨架</label><label><input id="motion" type="checkbox">头部运动</label></div>
<div id="hand-controls" hidden><span id="hand-status"></span><label>手指<select id="finger" aria-label="手指测试"><option value="Index">食指</option><option value="Thumb">拇指</option><option value="Middle">中指</option><option value="Ring">无名指</option><option value="Little">小指</option><option value="All">全部五指</option></select></label><label>弯曲<input id="finger-angle" aria-label="手指弯曲角度" type="range" min="0" max="55" value="0"></label><button id="finger-reset">复位手指</button></div>
<div id="expression-controls" hidden><span id="expression-status">VRM 表情</span><label>表情<select id="expression" aria-label="表情测试"><option value="blink">双眼闭合</option><option value="blinkLeft">左眼闭合</option><option value="blinkRight">右眼闭合</option><option value="happy">微笑</option><option value="aa">张嘴</option></select></label><label>强度<input id="expression-weight" aria-label="表情强度" type="range" min="0" max="100" value="0"></label><button id="expression-reset">复位表情</button></div>
<div id="viewport"></div><footer>拖动旋转 · 滚轮缩放 · 右键平移<span id="detail">等待载入</span></footer></section></main>
<script type="module" src="viewer.js"></script></body></html>
