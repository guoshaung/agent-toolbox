# Build and validate Windows artifacts before a separate job publishes them.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify update metadata and installer
        run: node scripts/verify-update-artifacts.js

      - uses: actions/upload-artifact@v4
        with:
          name: dist-win
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/Agent-Toolbox-*-win-x64.exe
            dist/Agent-Toolbox-*-win-x64.exe.blockmap
            dist/latest.yml

  publish:
    # The default success condition skips this job if any build step fails.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-win
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --title "Agent 工具箱 $TAG" --generate-notes
          fi
