# 打一个 v 开头的 tag 就自动出包并发到 Releases。
#
#   npm version patch          # 会自动改 package.json 并打 tag
#   git push && git push --tags
#
# 之后客户端里的更新器就能查到这个新版本。
name: 构建并发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:          # 也可以在 Actions 页面手动点一次

permissions:
  contents: write             # 创建 Release 需要写权限

jobs:
  build:
    strategy:
      fail-fast: false        # mac 挂了不影响 windows 继续出包
      matrix:
        include:
          - os: macos-latest
            build: npx electron-builder --mac dmg zip --arm64
          - os: windows-latest
            build: npx electron-builder --win nsis portable --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 语法自检，别把跑不起来的版本发出去
      - run: npm run check

      - name: 打包并上传
        run: ${{ matrix.build }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不签名。注意别在这里写 CSC_LINK: ${{ secrets.XXX }} 占位 ——
          # secret 不存在时它是空字符串，electron-builder 会当成「给了证书路径」
          # 去读，解析成项目目录，报 “... not a file” 直接失败。
          #
          # 以后买了 Apple 开发者证书要开签名，把下面两行取消注释并配好 secret：
          #   CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          #   CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # 并把这一行删掉：
          CSC_IDENTITY_AUTO_DISCOVERY: false
