# 两个平台各自构建并校验，最后由一个 job 统一发布到同一个 release。
# （不能让两个平台各自 --publish，它们会并行地各建一个 draft，产物散在两个草稿里。）
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify update metadata and installer
        run: node scripts/verify-update-artifacts.js

      - uses: actions/upload-artifact@v4
        with:
          name: dist-win
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/Agent-Toolbox-*-win-x64.exe
            dist/Agent-Toolbox-*-win-x64.exe.blockmap
            dist/latest.yml

  # macOS 的包不能少：日常用的就是 Mac。
  # zip 是 macOS 更新器唯一认的格式（dmg 它找不到），dmg 给人手动装。
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Build macOS arm64
        run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          # 不签名。别在这写 CSC_LINK 的 secrets 占位 —— secret 不存在时是空字符串，
          # electron-builder 会当成「给了证书路径」去读，报 "... not a file" 直接失败。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/Agent-Toolbox-*-mac-arm64.dmg
            dist/Agent-Toolbox-*-mac-arm64.dmg.blockmap
            dist/Agent-Toolbox-*-mac-arm64.zip
            dist/Agent-Toolbox-*-mac-arm64.zip.blockmap
            dist/latest-mac.yml

  publish:
    # The default success condition skips this job if any build step fails.
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true      # 两个平台的产物合到同一个目录

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 先把 release 本身建出来（不带产物），再一个一个传。
          # 之前是 create 时带上全部产物，结果 146MB 的 dmg 传到一半 504，
          # 整个 release 都没留下来，得重跑一整次。分开之后超时只影响那一个文件。
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Agent 工具箱 $TAG" --generate-notes
          fi
          # GitHub 的上传端点对大文件偶尔 504，重试三次
          for file in artifacts/*; do
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::$file 传了三次都没成功"
                exit 1
              fi
              echo "$file 第 $attempt 次失败，等 15 秒再试"
              sleep 15
            done
          done
          # 少传一个都可能让自动更新装不上（macOS 认 zip、Windows 认 exe），所以清点一遍
          missing=0
          for file in artifacts/*; do
            name=$(basename "$file")
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "$name"; then
              echo "::error::$name 没出现在 release 里"
              missing=1
            fi
          done
          [ "$missing" = 0 ]
