plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // zxing 的扫码页要用 ActivityCompat / ContextCompat 申请相机权限，但它的 POM 只带
    // zxing:core，androidx 得由应用自己带。0.2.0 那版没带，一点「扫描连接二维码」就
    // NoClassDefFoundError 闪退回桌面。
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    // 两个 androidx 库各拉一版 kotlin-stdlib，撞 Duplicate class；用 BOM 对齐
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

android {
    namespace 'cn.macpe.agenttoolbox.remote'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.macpe.agenttoolbox.remote'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.3.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
