[project]
name = "agent-toolbox-game-agent"
version = "0.1.0"
description = "视觉闭环控制 PoC：截图 → 检测目标 → 判左右 → 敲 A/D → 再截图"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mss>=9.0",
    "pyautogui>=0.9.54",
]

# 这个目录是脚本集合而不是一个可安装的包，所以让 uv 别去构建它。
[tool.uv]
package = false
