<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- style-src 需要 'unsafe-inline'：KaTeX 用 innerHTML 注入的公式带内联 style（分数高度等），没有它 Chromium 会剥掉这些样式属性、分数会塌成一行 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" />
  <title>Agent 工具箱</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/tools.css" />
  <link rel="stylesheet" href="styles/deck.css" />
</head>
<body>
  <div id="app">
    <nav class="rail" id="rail"></nav>
    <main class="stage" id="stage"></main>
  </div>
  <!-- 隐藏的 DeepSeek 实例：打字纠错和专注建议都靠它，开机就热好 -->
  <div class="hidden-host" id="bridge-host"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
