<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Toolbox 绘图本"><meta name="theme-color" content="#f5f3ef"><title>Toolbox · 同步绘图本</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><b>Toolbox <span>绘图本</span></b><small id="identity">正在连接电脑</small></div><div class="connection"><i id="dot"></i><span id="status" role="status">连接中</span></div><button id="export">导出 PNG</button><button id="backup">备份绘图本</button></header>
<nav aria-label="绘图工具"><div class="tools"><button data-tool="pen" class="selected">✎ 钢笔</button><button data-tool="marker">▰ 高亮</button><button data-tool="eraser">◇ 橡皮</button><button data-tool="select">⌁ 套索</button><button data-tool="hand">✥ 移动</button></div><div class="settings"><input id="color" aria-label="笔颜色" type="color" value="#26384d"><input id="width" aria-label="笔粗细" type="range" min="1" max="30" value="3"><label><input id="pencil" type="checkbox">仅 Pencil</label><button id="undo" title="撤销 Ctrl/⌘ Z">↶</button><button id="redo" title="重做">↷</button><button id="delete">删除选中</button><button id="image">＋ 图片</button><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></div></nav>
<div class="workspace"><aside><div class="page-heading">我的纸张<button id="addPage" aria-label="新增纸张">＋</button></div><div id="pages"></div><select id="paper" aria-label="纸张类型"><option value="dots">点阵纸</option><option value="grid">方格纸</option><option value="lines">横线纸</option><option value="plain">空白纸</option></select><p>笔迹与图片双向同步<br>图片可拖入、粘贴<br>套索圈选后拖动<br>触控用「移动」拖拽<br>双指可缩放纸张</p></aside><main id="viewport"><canvas id="canvas" aria-label="手写绘图纸张"></canvas><div id="hint">落笔，把想法画下来。<br><small>同一绘图本，两台设备。</small></div></main></div>
<footer><span id="pageName">绘图本</span><div><button id="pdf">导入 PDF</button><input id="pdfFile" type="file" accept="application/pdf" hidden><button id="shrink">缩小图片</button><button id="enlarge">放大图片</button><button id="zoomOut">−</button><span id="zoom">100%</span><button id="zoomIn">＋</button><button id="fit">适合窗口</button></div><span>本机保存 · 实时同步</span></footer>
<dialog id="pair"><h2>连接你的 Toolbox</h2><p>请用 iPad 扫描电脑「同步绘图」页面中的连接二维码。确认设备编号后即可进入绘图本。</p><button id="reconnect">重新连接</button></dialog>
<script src="/app.js" defer></script></body></html>
